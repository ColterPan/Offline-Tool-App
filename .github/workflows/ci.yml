name: CI

# Pushes test on Windows only: the repo is private, and GitHub bills macOS minutes at 10x.
# Pull requests and manual runs (Actions > CI > Run workflow) also test on macOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest", "macos-14"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src tests
      - name: Test
        run: pytest --cov=offline_tools --cov-report=term --cov-fail-under=80
