[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-tools"
dynamic = ["version"]
description = "Everyday file tools (PDF, images, data, QR codes) that run entirely on your own computer."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Colter Pan" }]
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "Pillow>=11,<13",
    "platformdirs>=4,<5",
    "qrcode>=8,<9",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1", # openpyxl uses it automatically to block malicious XML in .xlsx
    "pypdfium2>=4.30,<6",
    "opencv-python-headless>=4.10,<5", # headless: no bundled Qt to clash with PySide6
    "zxing-cpp>=2.2,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "types-openpyxl",
    "types-qrcode",
]

[project.gui-scripts]
offline-tools = "offline_tools.app:main"

[tool.setuptools.dynamic]
version = { attr = "offline_tools.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offline_tools = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"

[tool.coverage.run]
source = ["offline_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"] # keep doc snippets as written

[tool.ruff.lint]
# T20 bans print(): use logging instead.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "T20", "PTH"]
ignore = [
    "N802", # Qt overrides such as dragEnterEvent are camelCase by design
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"] # ships without type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_calls = false # pytest-qt's mouse/keyboard helpers are untyped
